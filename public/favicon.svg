<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quiz Quest">
  <defs>
    <linearGradient id="bg" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#162849"/>
      <stop offset="55%" stop-color="#101d36"/>
      <stop offset="100%" stop-color="#0d172e"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.46" r="0.38">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="0.5" cy="0.9" r="0.44">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="indigo-fill" gradientUnits="objectBoundingBox" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="32%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="indigo-shine" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="indigo-rim" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="gold-fill" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="38%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="gold-hot" gradientUnits="objectBoundingBox" cx="0.24" cy="0.18" r="0.58">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.98"/>
      <stop offset="40%" stop-color="#fde68a" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-shine" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.42" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.48"/>
      <stop offset="32%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold-edge" gradientUnits="objectBoundingBox" x1="0" y1="0.55" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="gold-rim" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="shadow-back" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="shadow-front" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#020617" flood-opacity="0.52"/>
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.8" flood-color="#fbbf24" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#halo)"/>
  <rect width="64" height="64" rx="14" fill="url(#floor)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#1e3a5f" stroke-opacity="0.35" stroke-width="1"/>

  <g filter="url(#shadow-back)" transform="rotate(-9 28 31.5)">
    <rect x="11.5" y="14.5" width="33" height="33" rx="8.5" fill="url(#indigo-fill)"/>
    <rect x="11.5" y="14.5" width="33" height="33" rx="8.5" fill="url(#indigo-shine)"/>
    <rect x="11.5" y="14.5" width="33" height="33" rx="8.5" fill="none" stroke="url(#indigo-rim)" stroke-width="0.9"/>
  </g>

  <g filter="url(#shadow-front)" transform="rotate(7 39.5 44)">
    <rect x="21.5" y="23.5" width="33" height="33" rx="8.5" fill="#04080f" opacity="0.5"/>
    <rect x="19.5" y="21.5" width="33" height="33" rx="8.5" fill="url(#gold-fill)"/>
    <rect x="19.5" y="21.5" width="33" height="33" rx="8.5" fill="url(#gold-hot)"/>
    <rect x="19.5" y="21.5" width="33" height="33" rx="8.5" fill="url(#gold-shine)"/>
    <rect x="19.5" y="21.5" width="33" height="33" rx="8.5" fill="url(#gold-edge)"/>
    <rect x="19.5" y="21.5" width="33" height="33" rx="8.5" fill="none" stroke="url(#gold-rim)" stroke-width="0.8"/>
    <ellipse cx="27.5" cy="28.5" rx="6.5" ry="4.5" fill="#ffffff" opacity="0.38"/>
    <ellipse cx="31" cy="26" rx="2.2" ry="1.6" fill="#ffffff" opacity="0.22"/>
  </g>
